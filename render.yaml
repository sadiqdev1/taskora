services:
  # ─────────────────────────────────────────────────
  # Backend — Laravel API (Docker)
  # ─────────────────────────────────────────────────
  - type: web
    name: taskora-backend
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    plan: free
    region: oregon
    branch: main
    healthCheckPath: /up
    envVars:
      - key: APP_NAME
        value: Taskora
      - key: APP_ENV
        value: production
      - key: APP_DEBUG
        value: false
      - key: APP_KEY
        generateValue: true
      - key: APP_URL
        value: https://taskora-backend-v1ag.onrender.com

      # Database — Supabase PostgreSQL (direct connection, works on Render's IPv6-capable Docker)
      # The @ in the password must NOT be percent-encoded in individual env vars
      # (only in connection URL strings). Render passes it as-is to Laravel.
      - key: DB_CONNECTION
        value: pgsql
      - key: DB_HOST
        value: db.grcxsnmtovwqpmjuvxwa.supabase.co
      - key: DB_PORT
        value: 5432
      - key: DB_DATABASE
        value: postgres
      - key: DB_USERNAME
        value: postgres
      - key: DB_PASSWORD
        sync: false   # Set in Render dashboard: @Abu31720082030
      - key: DB_SSLMODE
        value: require

      # Cache + Queue — use database (no Redis needed on free plan)
      - key: CACHE_STORE
        value: database
      - key: QUEUE_CONNECTION
        value: database
      - key: SESSION_DRIVER
        value: database

      # Frontend URL (update to your Vercel/Render frontend URL after deploy)
      - key: FRONTEND_URL
        value: https://taskora.vercel.app

      # CORS
      - key: SANCTUM_STATEFUL_DOMAINS
        value: taskora.vercel.app,localhost:3000

      # Secrets — set manually in Render dashboard
      - key: RESEND_API_KEY
        sync: false
      - key: RESEND_DOMAIN_VERIFIED
        value: false
      - key: PAYSTACK_SECRET_KEY
        sync: false
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: GOOGLE_REDIRECT_URI
        value: https://taskora-backend-v1ag.onrender.com/api/auth/google/callback
      - key: CLOUDINARY_CLOUD_NAME
        sync: false
      - key: CLOUDINARY_API_KEY
        sync: false
      - key: CLOUDINARY_API_SECRET
        sync: false

  # ─────────────────────────────────────────────────
  # Frontend — Next.js (static export or Node)
  # ─────────────────────────────────────────────────
  - type: web
    name: taskora-frontend
    runtime: node
    rootDir: frontend
    buildCommand: npm install && npm run build
    startCommand: npm start
    plan: free
    region: oregon
    branch: main
    envVars:
      - key: NEXT_PUBLIC_API_URL
        value: https://taskora-backend.onrender.com/api
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 3000

